name: Weekend NFL Briefing

# Runs Saturday and Sunday mornings so predictions are ready well before 10am ET.
# Noon UTC = 8am EDT (Aug–Nov) / 7am EST (Nov–Jan) — both well ahead of kickoffs.
on:
  schedule:
    - cron: '0 12 * * 0,6'   # Sat + Sun at noon UTC
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Date to predict (YYYY-MM-DD). Defaults to today.'
        required: false
        default: ''
      to_email:
        description: 'Override recipient email.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  nfl-briefing:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train models if needed
        run: python3 scripts/train_if_needed.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Check NFL season
        run: |
          MONTH=$(date -u +%m)
          # NFL regular season: September (09) through January (01).
          # Skip August (08) and February–August off-season to avoid clobbering
          # MLB/Soccer predictions with an empty NFL file.
          if [ "$MONTH" -ge 2 ] && [ "$MONTH" -le 8 ]; then
            echo "Outside NFL season (month=$MONTH) — skipping briefing"
            echo "SKIP_NFL=true" >> $GITHUB_ENV
          else
            echo "SKIP_NFL=false" >> $GITHUB_ENV
          fi

      - name: Generate NFL predictions
        if: env.SKIP_NFL != 'true'
        run: |
          DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u '+%Y-%m-%d'); fi
          echo "Predicting NFL for $DATE"
          python3 predict_today.py --date "$DATE" --sport nfl
          echo "PRED_DATE=$DATE" >> $GITHUB_ENV
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Check that NFL predictions actually exist
        if: env.SKIP_NFL != 'true'
        run: |
          # Skip the email if the predictions file has no NFL games — happens
          # when nfl_data_py 404s on the current week's stats, model file is
          # missing, or the season hasn't kicked off yet. Better to send nothing
          # than a "picks: none" email every Saturday morning.
          NFL_COUNT=$(python3 -c "
          import json
          try:
              d = json.load(open('predictions_${PRED_DATE}.json'))
              print(sum(1 for g in d.get('games', []) if g.get('sport') == 'americanfootball_nfl'))
          except Exception:
              print(0)
          ")
          echo "NFL games in predictions file: $NFL_COUNT"
          if [ "$NFL_COUNT" = "0" ]; then
            echo "SKIP_EMAIL=true" >> $GITHUB_ENV
          else
            echo "SKIP_EMAIL=false" >> $GITHUB_ENV
          fi

      - name: Send email briefing
        if: env.SKIP_NFL != 'true' && env.SKIP_EMAIL != 'true'
        run: python3 scripts/email_briefing.py "predictions_${PRED_DATE}.json"
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ github.event.inputs.to_email || 'pdaly42@gmail.com' }}

      - name: Commit predictions
        if: env.SKIP_NFL != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions_*.json data/raw/
          git diff --staged --quiet || git commit -m "nfl-predictions: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git stash
          git pull --rebase origin main
          git stash pop || true
          git push
